schema_version: 1
id: ai.stocksense.stock-deep-analysis
name: 个股三维深度分析
version: 1.0.1
description: 基于妙想 MCP 的公司质地、舆情摘要与交易活跃度三维个股研究应用
entry: dist/index.html
icon: icon.png
sdk_version: 1.0.0
min_runtime_version: 1.0.0
display:
  theme: auto
  preferred_width: 1280
  preferred_height: 900
permissions:
  agent: false
  mcp_servers: []
  storage:
    mode: persistent
    quota_mb: 1
actions:
  analyze:
    kind: service
    title: 获取个股三维分析
    handler: finance.company.analysis
    input_schema: schemas/analysis.input.json
    output_schema: schemas/analysis.output.json
    timeout_seconds: 60
    max_concurrent_runs: 2
    cache_ttl_seconds: 10
  refresh:
    kind: service
    title: 刷新个股三维分析
    handler: finance.company.refresh
    input_schema: schemas/refresh.input.json
    output_schema: schemas/refresh.output.json
    timeout_seconds: 30
    max_concurrent_runs: 1
    cache_ttl_seconds: 0
