name: Build StockSense Desktop

# Internal distribution only: this workflow is deliberately manual and uploads
# installers as Actions artifacts. It never creates or changes a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - macos-arm64

# The workflow only reads the selected ref and uploads private workflow
# artifacts, so it never needs a write-capable GitHub token.
permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}-${{ inputs.target }}-split
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (offline + update + runtime)
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # prepare-offline-runtime keeps its own platform-specific Python and wheel
      # cache, separate from uv's normal cache. Keep it OS/arch/lockfile scoped.
      - name: Restore offline runtime cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: apps/desktop/build/offline-runtime-prep
          key: stocksense-offline-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'apps/desktop/scripts/prepare-offline-runtime.cjs') }}
          restore-keys: |
            stocksense-offline-runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify native build host
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or [Environment]::Is64BitOperatingSystem -ne $true) {
            throw 'Windows x64 installer must be built on a native Windows x64 runner.'
          }

      - name: Install workspace dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build offline installer
        working-directory: apps/desktop
        run: npm run dist:win:offline

      - name: Build Runtime update
        working-directory: apps/desktop
        run: npm run runtime:pack:win

      - name: Build lightweight desktop update
        working-directory: apps/desktop
        run: npm run dist:win:update

      - name: Write checksums
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path 'apps/desktop/release').Path
          Get-ChildItem 'apps/desktop/release' -File -Recurse |
            Where-Object { $_.Name -match '\.(exe|zip|blockmap|yml)$' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Replace($releaseRoot + '\', ''))" } |
            Set-Content 'apps/desktop/release/SHA256SUMS.txt'

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: stocksense-windows-x64-release
          path: |
            apps/desktop/release/offline/*.exe
            apps/desktop/release/update/*.exe
            apps/desktop/release/update/*.blockmap
            apps/desktop/release/update/*.yml
            apps/desktop/release/runtime/*.zip
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS arm64 (offline + update + runtime)
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # prepare-offline-runtime keeps its own platform-specific Python and wheel
      # cache, separate from uv's normal cache. Keep it OS/arch/lockfile scoped.
      - name: Restore offline runtime cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: apps/desktop/build/offline-runtime-prep
          key: stocksense-offline-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'apps/desktop/scripts/prepare-offline-runtime.cjs') }}
          restore-keys: |
            stocksense-offline-runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify native build host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Install workspace dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build offline installer
        working-directory: apps/desktop
        run: npm run dist:mac:offline

      - name: Build Runtime update
        working-directory: apps/desktop
        run: npm run runtime:pack:mac

      - name: Build lightweight desktop update
        working-directory: apps/desktop
        run: npm run dist:mac:update

      - name: Write checksums
        run: |
          cd apps/desktop/release
          find offline update runtime -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -print0 |
            xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Upload macOS installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: stocksense-macos-arm64-release
          path: |
            apps/desktop/release/offline/*.dmg
            apps/desktop/release/update/*.zip
            apps/desktop/release/update/*.blockmap
            apps/desktop/release/update/*.yml
            apps/desktop/release/runtime/*.zip
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release-bundle:
    name: Desktop release bundle (split delivery)
    if: inputs.target == 'all' && needs.windows.result == 'success' && needs.macos.result == 'success'
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stocksense-*-release
          path: desktop-release-input

      - name: Create upload bundle
        id: bundle
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          BUNDLE="desktop-release-bundle-${VERSION}-split.zip"
          node apps/desktop/scripts/create-release-bundle.mjs \
            --input desktop-release-input \
            --output "$BUNDLE" \
            --version "$VERSION" \
            --channel stable
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload management release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: stocksense-release-bundle-split
          path: ${{ steps.bundle.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
