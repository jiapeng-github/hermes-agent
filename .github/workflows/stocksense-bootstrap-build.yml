name: Build StockSense Setup

# Managed distribution only: this installer bootstraps a release checkout and
# stages StockSense Setup as the desktop app's self-update helper. It is kept
# separate from desktop-build.yml, whose offline Electron packages intentionally
# support manual replacement instead of Git-based self-update.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - macos-arm64

permissions:
  contents: read

concurrency:
  group: stocksense-bootstrap-build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Require the stable release branch
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne 'release') {
            throw 'Build StockSense Setup must run from the release branch.'
          }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify native build host
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or [Environment]::Is64BitOperatingSystem -ne $true) {
            throw 'StockSense Setup for Windows x64 must be built on a native Windows x64 runner.'
          }
          rustup --version
          cargo --version

      - name: Install workspace dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build StockSense Setup
        working-directory: apps/bootstrap-installer
        shell: pwsh
        env:
          HERMES_BUILD_PIN_BRANCH: release
          HERMES_BUILD_PIN_COMMIT: ${{ github.sha }}
        run: npm run tauri:build -- --bundles nsis

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem 'apps/bootstrap-installer/src-tauri/target/release/bundle/nsis' -Filter '*.exe' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Name)" } |
            Set-Content 'apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt'

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: stocksense-setup-windows-x64
          path: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe
            apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS arm64
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Require the stable release branch
        run: |
          test "${{ github.ref_name }}" = release || {
            echo "Build StockSense Setup must run from the release branch." >&2
            exit 1
          }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify native build host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          rustup --version
          cargo --version

      - name: Install workspace dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build StockSense Setup
        working-directory: apps/bootstrap-installer
        env:
          HERMES_BUILD_PIN_BRANCH: release
          HERMES_BUILD_PIN_COMMIT: ${{ github.sha }}
        run: npm run tauri:build -- --bundles dmg

      - name: Write checksums
        run: |
          cd apps/bootstrap-installer/src-tauri/target/release/bundle/dmg
          shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: stocksense-setup-macos-arm64
          path: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/*.dmg
            apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
